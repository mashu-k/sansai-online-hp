name: 🔧 Chore
description: リファクタ・依存更新・ドキュメント・テスト・CI
title: "[Chore] "
labels: ["type:chore", "status:triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 種別
      options:
        - refactor (リファクタリング)
        - deps (依存更新)
        - docs (ドキュメント)
        - test (テスト追加・修正)
        - ci (CI/CD)
        - other
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 対象
      placeholder: "対象ファイル / モジュール / 設定"
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 理由
      description: なぜ実施するか（技術負債、セキュリティ、パフォーマンス等）
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影響範囲
      placeholder: "破壊的変更の有無、関連機能への影響等"

  - type: checkboxes
    id: claude_auto
    attributes:
      label: Claude Code 自動着手
      options:
        - label: Claude Code に自動着手させてOK
